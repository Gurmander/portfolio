<header class="site-header">
  <div class="container header-inner">

    <a class="site-name" href="{{ site.Home.RelPermalink }}">
      {{ hugo.Data.site.name }}
    </a>

    <nav>
      <a href="{{ "search/" | relURL }}">Search</a>
      <a href="{{ site.Home.RelPermalink }}#about">About</a>
      <a href="{{ "projects/" | relURL }}">Projects</a>
      <a href="{{ "blog/" | relURL }}">Blog</a>
      <a href="{{ "tags/" | relURL }}">Tags</a>

      <a
        href="{{ hugo.Data.site.resume | relURL }}"
        target="_blank"
        rel="noopener"
      >
        Resume
      </a>

      <a
        href="{{ hugo.Data.site.github }}"
        target="_blank"
        rel="noopener"
      >
        GitHub
      </a>

      <button
        id="theme-toggle"
        aria-label="Toggle dark mode"
        type="button"
      >
        ◐
      </button>
    </nav>

  </div>
</header>

<script>
document.getElementById("theme-toggle")?.addEventListener("click", () => {
  document.documentElement.classList.toggle("dark");

  const theme =
    document.documentElement.classList.contains("dark")
      ? "dark"
      : "light";

  localStorage.setItem("theme", theme);
});
</script>
